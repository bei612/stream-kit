[package]
name = "stream-kit-audio-target"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
cpal = "=0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
