[package]
name = "stream-kit-audio-target"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
network = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:rustls"]

[dependencies]
cpal = "=0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"], optional = true }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
futures = { version = "0.3", optional = true }

rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }

[patch.crates-io]
pulseaudio = { path = "../../third_party/pulseaudio-rs" }
