name: linux-sunshine-build

on:
  push:
    branches: [main]
    paths:
      - 'third_party/sunshine/**'
      - 'third_party-manifests/sunshine-dependencies.json'
      - 'third_party-manifests/upstream-lock.json'
      - 'scripts/build-sunshine.sh'
      - 'scripts/lib/platform-layout.mjs'
      - 'orchestrator/internal/bundle/layouts.json'
      - 'scripts/renderer-build-profile.mjs'
      - 'scripts/verify-sunshine-release.mjs'
      - 'orchestrator/**'
      - 'components/**'
      - 'third_party/moonlight-web-stream/**'
      - 'third_party/moonlight-common-rust/**'
      - 'third_party/webrtc-rs/**'
      - 'scripts/build-control-plane.mjs'
      - 'scripts/build-gateway*.mjs'
      - 'scripts/build-linux-installer.mjs'
      - 'scripts/package-platform-release.mjs'
      - 'scripts/accept-linux-installer.sh'
      - 'scripts/lib/**'
      - 'deploy/linux/**'
      - 'deploy/stream-kit-orchestrator.service'
      - 'scripts/test-audio-target-linux.sh'
      - 'tools/sunshine-codec-probe/**'
      - 'tools/check-sunshine-vendor.cjs'
      - 'tools/test-source-patching.cmake'
      - 'tools/test-sunshine-sdk.cmake'
      - 'tools/verify-native-tests.cjs'
      - 'scripts/test-native-test-report.cjs'
      - '.github/workflows/linux-sunshine-build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: linux-sunshine-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sunshine:
    name: Source-built Linux unified installer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.local/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      GOTOOLCHAIN: local
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/targets/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .local/ccache
          key: sunshine-ccache-ubuntu24-${{ runner.arch }}-v1-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: sunshine-ccache-ubuntu24-${{ runner.arch }}-v1-
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/moonlight-web-stream -> ../../.local/targets/native
          key: linux-product-${{ hashFiles('components/audio-target/Cargo.lock', 'third_party/moonlight-common-rust/Cargo.lock', 'third_party-manifests/gateway-web/*.Cargo.lock') }}
          cache-on-failure: 'true'
      - run: node --test scripts/test-native-test-report.cjs
      - name: Install distribution build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential clang ccache autoconf automake libtool meson nasm \
            pkg-config patch texinfo python3-jinja2 zlib1g-dev libass-dev libfreetype6-dev \
            libgnutls28-dev libmp3lame-dev libopus-dev libsdl2-dev libvorbis-dev libnuma-dev \
            libcap-dev libcurl4-openssl-dev libdrm-dev libevdev-dev libgbm-dev libgl-dev \
            libminiupnpc-dev libpipewire-0.3-dev libpulse-dev libssl-dev libsystemd-dev \
            libudev-dev libva-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-dri3-dev \
            libxcb-res0-dev libxcb-composite0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxfixes-dev libxrandr-dev libxtst-dev libvulkan-dev glslang-tools \
            qt6-base-dev qt6-svg-dev pulseaudio pulseaudio-utils xvfb xauth x11-utils \
            libasound2-dev libclang-dev dpkg-dev
          mkdir -p artifacts/linux-sunshine
          dpkg-query -W > artifacts/linux-sunshine/distribution-packages.txt
      - uses: actions/cache/restore@v4
        id: codec-cache
        with:
          path: .local/cmake-build-sunshine-deps
          key: linux-codec-sdk-v1-${{ hashFiles('artifacts/linux-sunshine/distribution-packages.txt', 'third_party/sunshine/third-party/build-deps/**', 'tools/sunshine-codec-probe/**', 'third_party-manifests/sunshine-dependencies.json') }}
      - name: Build vendored codecs and integrated Sunshine
        env:
          BUILD_JOBS: '2'
          SUNSHINE_PACKAGE_LAYOUT: platform
          SUNSHINE_REQUIRE_CLEAN: '1'
        run: |
          mkdir -p artifacts/linux-sunshine
          echo '::add-matcher::third_party/sunshine/.github/matchers/gcc.json'
          # This profile validates the complete application with software/VAAPI encoding.
          # CUDA-specific compilation and GPU runtime acceptance remain separate requirements.
          bash scripts/build-sunshine.sh -DSUNSHINE_ENABLE_CUDA=OFF -DBUILD_DOCS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee artifacts/linux-sunshine/build.log
      # Retain valid object compilations even if a later source file fails.
      # Executables and acceptance results are always rebuilt/rechecked.
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .local/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.codec-cache.outputs.cache-primary-key != '' && steps.codec-cache.outputs.cache-hit != 'true'
        with:
          path: .local/cmake-build-sunshine-deps
          key: ${{ steps.codec-cache.outputs.cache-primary-key }}
      - name: Verify capture in the integrated test executable
        timeout-minutes: 2
        run: |
          STREAM_KIT_TEST_X11_CAPTURE=1 xvfb-run -a sh scripts/test-audio-target-linux.sh --application-only "$GITHUB_WORKSPACE/.local/cmake-build-sunshine/tests/test_sunshine" 2>&1 | tee artifacts/linux-sunshine/runtime.log
          node tools/verify-native-tests.cjs artifacts/audio-target/linux-application-audio.json capture
      - name: Verify management capture capabilities and application persistence
        timeout-minutes: 2
        working-directory: artifacts/linux-sunshine
        run: |
          "$GITHUB_WORKSPACE/.local/cmake-build-sunshine/tests/test_sunshine" --gtest_filter='ConfigHttpTest.CaptureCapabilities*:ManagedAppsHttpTest.ApplicationModeSaveMatchesAdvertisedCapabilityAndLaunchRules:GraphicsAttributes.*:ResourcePathTest.*' --gtest_output=json:management.json 2>&1 | tee -a runtime.log
          node "$GITHUB_WORKSPACE/tools/verify-native-tests.cjs" management.json management
          node "$GITHUB_WORKSPACE/tools/verify-native-tests.cjs" management.json graphics
          node "$GITHUB_WORKSPACE/tools/verify-native-tests.cjs" management.json resources
      - name: Verify staged installation resolves its private Vulkan loader
        run: |
          node scripts/verify-sunshine-release.mjs .local/cmake-build-sunshine "$GITHUB_SHA" --output artifacts/linux-sunshine/renderer 2>&1 | tee artifacts/linux-sunshine/installed-runtime.log
      - name: Build control, native gateway and browser assets
        run: |
          npm ci --prefix orchestrator/web
          npm ci --prefix third_party/moonlight-web-stream
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          node scripts/build-control-plane.mjs --require-clean --output artifacts/linux-product/control
          node scripts/build-gateway-release.mjs --output artifacts/linux-product/gateway
      - name: Package and check native Linux initialization
        run: |
          node scripts/package-platform-release.mjs artifacts/linux-product/control artifacts/linux-product/gateway artifacts/linux-sunshine/renderer artifacts/linux-product/platform
          node scripts/build-linux-installer.mjs artifacts/linux-product/platform artifacts/linux-product/installer
          bash scripts/accept-linux-installer.sh artifacts/linux-product/installer 2>&1 | tee artifacts/linux-product/installer-acceptance.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-product-installer-${{ github.sha }}
          path: |
            artifacts/linux-product/installer/*-setup.run
            artifacts/linux-product/installer/installer-manifest.json
            artifacts/linux-product/installer/SHA256SUMS
            artifacts/linux-product/installer-acceptance.log
          if-no-files-found: error
      - name: Publish failure details to the check
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('build', 'runtime'):
              path = Path(f'artifacts/linux-sunshine/{name}.log')
              if path.exists():
                  tail = '\n'.join(path.read_text(errors='replace').splitlines()[-60:])
                  for offset in range(0, len(tail), 2500):
                      escaped = tail[offset:offset + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title=Linux Sunshine {name} {offset // 2500 + 1}::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-sunshine-source-build
          path: |
            artifacts/linux-sunshine/
            artifacts/audio-target/
            .local/cmake-build-sunshine/sunshine
          if-no-files-found: error
