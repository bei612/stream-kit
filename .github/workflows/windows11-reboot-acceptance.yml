name: windows11-reboot-acceptance
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Windows installer to test in a clean Windows 11 x64 guest
        type: string
        required: false
      product_run_id:
        description: Unpublished Windows installer build to test instead of a release tag
        type: string
        required: false
      diagnostic_product_run_id:
        description: Optional same-source Windows build providing a diagnostic runtime for failed initialization
        type: string
        required: false
      initialization_only:
        description: Diagnose the native initializer without repeating an already failed installation
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_RUN_ID: ${{ inputs.product_run_id }}
      DIAGNOSTIC_PRODUCT_RUN_ID: ${{ inputs.diagnostic_product_run_id }}
      INITIALIZATION_ONLY: ${{ inputs.initialization_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated guest tools
        run: |
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl qemu-system-x86 qemu-utils ovmf swtpm genisoimage
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Verify Windows install and system reboot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run-windows11-reboot-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-reboot-evidence
          path: artifacts/windows11-reboot
          retention-days: 10
          if-no-files-found: ignore
