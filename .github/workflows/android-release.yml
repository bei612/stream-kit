name: android-release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: APK version name (for example 0.1.0-preview.20261106.1)
        required: true
        type: string
      version_code:
        description: Increasing Android version code
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: android --sdk="$ANDROID_HOME" sdk install 'platforms;android-37' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Build with the durable project signing identity
        working-directory: third_party/moonlight-android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          STREAM_KIT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
          test -n "$KEYSTORE_BASE64"
          test -n "$STREAM_KIT_ANDROID_STORE_PASSWORD"
          export STREAM_KIT_ANDROID_KEYSTORE="$RUNNER_TEMP/stream-kit-release.p12"
          trap 'rm -f -- "$STREAM_KIT_ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STREAM_KIT_ANDROID_KEYSTORE"
          unset KEYSTORE_BASE64
          ./gradlew :app:assembleNonRootRelease :app:assembleNonRootReleaseAndroidTest :app:writeManagedRuntimeInventory \
            "-PstreamKitVersionName=$RELEASE_VERSION" "-PstreamKitVersionCode=$RELEASE_CODE" \
            "-PstreamKitSourceCommit=$GITHUB_SHA" -PstreamKitSourceDirty=false \
            --no-daemon --max-workers=2 --console=plain
      - name: Verify and inventory the candidate
        run: python3 scripts/android/package-release.py
      - name: Exercise minified native JNI on an official emulator
        run: bash scripts/android/ci-native-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stream-kit-android-release-candidate
          path: artifacts/android-release/
          retention-days: 14
          if-no-files-found: error
