name: linux-native-capture

on:
  push:
    branches: [main]
    paths:
      - 'third_party/sunshine/**'
      - 'tools/sunshine-audio-tests/**'
      - 'tools/verify-native-tests.cjs'
      - 'scripts/test-native-test-report.cjs'
      - 'scripts/test-audio-target-linux.sh'
      - 'components/audio-target/**'
      - '.github/workflows/linux-native-capture.yml'
  pull_request:
    branches: [main]
    paths:
      - 'third_party/sunshine/**'
      - 'tools/sunshine-audio-tests/**'
      - 'tools/verify-native-tests.cjs'
      - 'scripts/test-native-test-report.cjs'
      - 'scripts/test-audio-target-linux.sh'
      - 'components/audio-target/**'
      - '.github/workflows/linux-native-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Preserve evidence from a running native build while newer changes are queued.
concurrency:
  group: linux-native-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-microphone-target:
    name: Linux microphone target endpoint pair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/audio-target
      - name: Install isolated audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pulseaudio pulseaudio-utils
      - name: Build the production microphone target probe
        run: cargo build --locked --examples --manifest-path components/audio-target/Cargo.toml
      - name: Verify explicit render and capture endpoints
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/audio-target
          sh scripts/test-audio-target-linux.sh 2>&1 | tee artifacts/audio-target/pair-runtime.log
      - name: Attach endpoint failure location
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('artifacts/audio-target/pair-runtime.log')
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-20:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Microphone endpoint runtime failure::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-microphone-target
          path: artifacts/audio-target/
          if-no-files-found: warn

  linux-native-capture:
    name: Linux native application capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: node --test scripts/test-native-test-report.cjs
      - name: Install native build and isolated audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libpulse-dev pulseaudio pulseaudio-utils libxcb-res0-dev libxcb-composite0-dev libxcb-shm0-dev libxcb-xfixes0-dev xvfb xauth x11-utils
      - name: Build the production application capture backend
        run: |
          mkdir -p artifacts/audio-target
          echo '::add-matcher::third_party/sunshine/.github/matchers/gcc.json'
          cmake -S tools/sunshine-audio-tests -B .local/cmake-build-linux-audio -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee artifacts/audio-target/native-build.log
          cmake --build .local/cmake-build-linux-audio --parallel 2 2>&1 | tee -a artifacts/audio-target/native-build.log
      - name: Attach native build diagnostics to the check
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('artifacts/audio-target/native-build.log')
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-60:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native capture build diagnostics::{escaped}')
          PY
      - name: Verify process ownership, window input, and audio isolation
        timeout-minutes: 2
        run: |
          STREAM_KIT_TEST_X11_CAPTURE=1 xvfb-run -a sh scripts/test-audio-target-linux.sh --application-only "$GITHUB_WORKSPACE/.local/cmake-build-linux-audio/test_sunshine" 2>&1 | tee artifacts/audio-target/native-runtime.log
          node tools/verify-native-tests.cjs artifacts/audio-target/linux-application-audio.json capture
      - name: Attach native runtime failure to the check
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('artifacts/audio-target/native-runtime.log')
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-100:])
              # Check annotations truncate long messages. Preserve the server's
              # negotiated latency as well as the failed assertion.
              for offset in range(0, len(tail), 2500):
                  escaped = tail[offset:offset + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Native capture runtime failure {offset // 2500 + 1}::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-capture
          path: artifacts/audio-target/
          if-no-files-found: error

