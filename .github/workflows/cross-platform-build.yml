name: cross-platform-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: orchestrator/go.sum
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o dist/orchestrator${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/orchestrator
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ runner.os }}-${{ runner.arch }}
          path: orchestrator/dist/orchestrator${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  web:
    name: Management Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test ../../scripts/test-microphone-capture.mjs ../../scripts/test-media-access.mjs

  moonlight-web:
    name: Moonlight Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: third_party/moonlight-web-stream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: third_party/moonlight-web-stream/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/moonlight-web-stream
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: node ../../scripts/smoke-gateway-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-browser-${{ runner.os }}-${{ runner.arch }}
          path: third_party/moonlight-web-stream/dist
          if-no-files-found: error
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-web-${{ runner.os }}-${{ runner.arch }}
          path: |
            third_party/moonlight-web-stream/target/release/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
            third_party/moonlight-web-stream/target/release/web-server
          if-no-files-found: error

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: stream-kit-sbom.spdx.json
          output-file: stream-kit-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: stream-kit-sbom
          path: stream-kit-sbom.spdx.json

