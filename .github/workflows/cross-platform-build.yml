name: cross-platform-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum
      - run: go mod vendor
      - run: git diff --exit-code -- vendor
      - name: Test Orchestrator
        shell: bash
        run: mkdir -p ../artifacts/ci && go test -json ./... | tee ../artifacts/ci/orchestrator-tests.jsonl
      - name: Annotate failing Go tests
        if: failure()
        run: node ../scripts/report-go-test-failures.mjs ../artifacts/ci/orchestrator-tests.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrator-tests-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/ci/orchestrator-tests.jsonl
          if-no-files-found: warn
      - run: go -C ../third_party/sevenzip test ./...
      - name: Test Windows example audio protocol handling
        if: runner.os == 'Windows'
        run: go -C ../example test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./cmd/orchestrator ./internal/util ./internal/app ./internal/session ./internal/ws ./internal/server/...
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
        working-directory: orchestrator/web
      - name: Build versioned control-plane bundle
        run: node ../scripts/build-control-plane.mjs --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ runner.os }}-${{ runner.arch }}
          path: orchestrator/bundle
          if-no-files-found: error

  web:
    name: Management Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test ../../scripts/test-go-test-failures.mjs ../../scripts/test-go-notices.mjs ../../scripts/test-control-build-target.mjs
      - run: node --experimental-strip-types --test ../../scripts/test-frontend-notices.mjs
      - run: node --test ../../scripts/test-audio-playback-lifecycle.mjs ../../scripts/test-realtime-track-writer.mjs ../../scripts/test-opus-audio.mjs
      - run: node --experimental-strip-types --test ../../scripts/test-microphone-capture.mjs ../../scripts/test-microphone-sender.mjs ../../scripts/test-media-access.mjs ../../scripts/test-media-observation.mjs ../../scripts/test-viewer-bootstrap.mjs ../../scripts/test-webrtc-lifecycle.mjs ../../scripts/test-websocket-lifecycle.mjs ../../scripts/test-management-websocket.mjs ../../scripts/test-canvas-lifecycle.mjs ../../scripts/test-stream-pipelines.mjs ../../scripts/test-decoder-lifecycle.mjs ../../scripts/test-browser-condition.cjs
      - name: Install locked browser test tooling
        run: npm ci --ignore-scripts
        working-directory: third_party/moonlight-web-stream
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: third_party/moonlight-web-stream
      - name: Verify management interactions across browser engines
        working-directory: .
        env:
          BROWSER_CHANNEL: chromium
        run: |
          for engine in chromium firefox webkit; do
            BROWSER_ENGINE="$engine" node scripts/test-admin-session-audio.cjs
            BROWSER_ENGINE="$engine" node scripts/test-admin-encoder-configuration.cjs
            BROWSER_ENGINE="$engine" node scripts/test-admin-worker-configuration.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-browser-interactions
          path: |
            artifacts/session-audio/
            artifacts/encoder-configuration/
          if-no-files-found: warn

  moonlight-web:
    name: Moonlight Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: third_party/moonlight-web-stream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: third_party/moonlight-web-stream/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux audio development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pulseaudio pulseaudio-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/moonlight-web-stream
      - run: cargo check --locked
      - run: cargo test --locked --all-targets --manifest-path ../../components/audio-target/Cargo.toml
      - run: cargo clippy --locked --manifest-path ../../components/audio-target/Cargo.toml --all-targets -- -D warnings
      - name: Verify isolated Linux microphone endpoint pair
        if: runner.os == 'Linux'
        run: sh ../../scripts/test-audio-target-linux.sh
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: audio-target-linux-acceptance
          path: artifacts/audio-target
          if-no-files-found: warn
      - run: cargo test --locked
      - name: Verify owned UDP port allocation
        run: cargo test --locked --manifest-path ../webrtc-rs/Cargo.toml --lib udp_port_range
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox
      # The production audio pipe type graph imports generated protocol bindings.
      # Run after the complete gateway build, not in the management-only job.
      - name: Verify browser audio and microphone RTP lifecycle
        shell: bash
        working-directory: .
        env:
          BROWSER_CHANNEL: chromium
        run: |
          for engine in chromium firefox; do
            BROWSER_ENGINE="$engine" node scripts/test-audio-playback-browser.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audio-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/audio-playback/
          if-no-files-found: warn
      - run: node ../../scripts/smoke-gateway-browser.cjs
      - run: node ../../scripts/smoke-gateway-browser.cjs
        env:
          BROWSER_ENGINE: firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/gateway-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-browser-${{ runner.os }}-${{ runner.arch }}
          path: third_party/moonlight-web-stream/dist
          if-no-files-found: error
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: node ../../scripts/test-gateway-config.cjs target/release/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: node ../../scripts/smoke-media-contract.cjs target/release/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-contract-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/media-contract/**/result.json
            artifacts/media-contract/**/gateway.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-web-${{ runner.os }}-${{ runner.arch }}
          path: |
            third_party/moonlight-web-stream/target/release/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
            third_party/moonlight-web-stream/target/release/web-server
          if-no-files-found: error

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: stream-kit-sbom.spdx.json
          output-file: stream-kit-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: stream-kit-sbom
          path: stream-kit-sbom.spdx.json

