name: cross-platform-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Nested upstream .gitattributes files can override the vendor byte policy.
    # Apply the same checkout policy from the first checkout through Go's VCS
    # inspection, without changing global Git configuration on the runner.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    # Preserve each component's running acceptance without letting another
    # component or operating system block its next revision.
    concurrency:
      group: control-build-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum
      - run: go mod vendor
      - name: Verify regenerated vendor source
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const result = spawnSync('git', ['diff', '--no-ext-diff', '--exit-code', '--', 'vendor'], {encoding:'utf8', maxBuffer:8*1024*1024});
          if (result.status !== 0) {
            const detail = (result.stdout || result.stderr || String(result.error)).slice(0, 6000);
            const escaped = detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Regenerated vendor source differs::${escaped}`);
            process.exit(1);
          }
          JS
      - name: Test Orchestrator
        shell: bash
        run: mkdir -p ../artifacts/ci && go test -json ./... | tee ../artifacts/ci/orchestrator-tests.jsonl
      - name: Annotate failing Go tests
        if: failure()
        run: node ../scripts/report-go-test-failures.mjs ../artifacts/ci/orchestrator-tests.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrator-tests-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/ci/orchestrator-tests.jsonl
          if-no-files-found: warn
      - run: go -C ../third_party/sevenzip test ./...
      - name: Test Windows example audio protocol handling
        if: runner.os == 'Windows'
        run: go -C ../example test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./cmd/orchestrator ./internal/util ./internal/app ./internal/session ./internal/ws ./internal/server/...
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
        working-directory: orchestrator/web
      - name: Build versioned control-plane bundle
        id: control_bundle
        shell: bash
        run: node ../scripts/build-control-plane.mjs --require-clean 2>&1 | tee ../artifacts/ci/control-bundle-build.log
      - name: Attach control bundle build failure
        if: failure() && steps.control_bundle.outcome == 'failure'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const log = fs.readFileSync('../artifacts/ci/control-bundle-build.log', 'utf8').split(/\r?\n/).slice(-60).join('\n');
          for (let offset = 0; offset < log.length; offset += 2500) {
            const message = log.slice(offset, offset + 2500).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Control bundle build ${offset / 2500 + 1}::${message}`);
          }
          // Inspect a non-secret vendor manifest to distinguish source changes
          // from checkout conversion or executable-mode changes on CI runners.
          for (const args of [
            ['diff', '--no-ext-diff', '--', 'vendor/modules.txt'],
            ['ls-files', '--eol', '--', 'vendor/modules.txt'],
            ['config', '--show-origin', '--get-regexp', 'core\\.(autocrlf|filemode|safecrlf)'],
          ]) {
            const detail = execFileSync('git', args, {encoding:'utf8'}).slice(0, 6000);
            const message = detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Control source ${args[0]}::${message}`);
          }
          JS
      - name: Install locked bundle acceptance browser tooling
        run: npm ci --ignore-scripts
        working-directory: third_party/moonlight-web-stream
      - name: Install bundle acceptance browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: third_party/moonlight-web-stream
      - name: Verify the native control bundle with external configuration
        working-directory: .
        env:
          BROWSER_CHANNEL: chromium
        run: node scripts/accept-control-bundle.cjs orchestrator/bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bundle-acceptance-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/control-bundle/
            artifacts/ci/control-bundle-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ runner.os }}-${{ runner.arch }}
          path: orchestrator/bundle
          if-no-files-found: error

  web:
    name: Management Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: management-web-build-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: orchestrator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test ../../scripts/test-go-test-failures.mjs ../../scripts/test-go-notices.mjs ../../scripts/test-cargo-notices.mjs ../../scripts/test-control-build-target.mjs
      - run: node --experimental-strip-types --test ../../scripts/test-frontend-notices.mjs
      - run: node --test ../../scripts/test-audio-playback-lifecycle.mjs ../../scripts/test-realtime-track-writer.mjs ../../scripts/test-opus-audio.mjs
      - run: node --experimental-strip-types --test ../../scripts/test-microphone-capture.mjs ../../scripts/test-microphone-sender.mjs ../../scripts/test-media-access.mjs ../../scripts/test-media-observation.mjs ../../scripts/test-viewer-bootstrap.mjs ../../scripts/test-webrtc-lifecycle.mjs ../../scripts/test-websocket-lifecycle.mjs ../../scripts/test-management-websocket.mjs ../../scripts/test-canvas-lifecycle.mjs ../../scripts/test-stream-pipelines.mjs ../../scripts/test-decoder-lifecycle.mjs ../../scripts/test-browser-condition.cjs
      - name: Install locked browser test tooling
        run: npm ci --ignore-scripts
        working-directory: third_party/moonlight-web-stream
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: third_party/moonlight-web-stream
      - name: Verify management interactions across browser engines
        working-directory: .
        env:
          BROWSER_CHANNEL: chromium
        run: |
          for engine in chromium firefox webkit; do
            BROWSER_ENGINE="$engine" node scripts/test-admin-session-audio.cjs
            BROWSER_ENGINE="$engine" node scripts/test-admin-encoder-configuration.cjs
            BROWSER_ENGINE="$engine" node scripts/test-admin-worker-configuration.cjs
            BROWSER_ENGINE="$engine" node scripts/test-admin-render-nodes.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-browser-interactions
          path: |
            artifacts/session-audio/
            artifacts/encoder-configuration/
            artifacts/admin-render-nodes/
          if-no-files-found: warn

  moonlight-web:
    name: Moonlight Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: gateway-build-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: third_party/moonlight-web-stream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: third_party/moonlight-web-stream/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux audio development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pulseaudio pulseaudio-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/moonlight-web-stream
      - run: cargo check --locked
      - name: Verify gateway source stamp validation
        run: node ../../scripts/test-gateway-build-stamp.mjs
      - run: cargo test --locked --features network --all-targets --manifest-path ../../components/audio-target/Cargo.toml
      - run: cargo clippy --locked --features network --manifest-path ../../components/audio-target/Cargo.toml --all-targets -- -D warnings
      - name: Verify isolated Linux microphone endpoint pair
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sh ../../scripts/test-audio-target-linux.sh
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: audio-target-linux-acceptance
          path: artifacts/audio-target
          if-no-files-found: warn
      - run: cargo test --locked
      - name: Verify owned UDP port allocation
        run: cargo test --locked --manifest-path ../webrtc-rs/Cargo.toml --lib udp_port_range
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: node ../../scripts/build-gateway-release.mjs --output ../../artifacts/release/gateway
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node ../../scripts/test-gateway-config.cjs ../../artifacts/release/gateway/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: node ../../scripts/smoke-media-contract.cjs ../../artifacts/release/gateway/web-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-contract-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/media-contract/**/result.json
            artifacts/media-contract/**/gateway.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-web-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/gateway
          if-no-files-found: error
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Install WebKit media test runtime on Linux
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps webkit
      - run: node ../../scripts/smoke-gateway-browser.cjs ../../artifacts/release/gateway/dist
      - run: node ../../scripts/smoke-gateway-browser.cjs ../../artifacts/release/gateway/dist
        env:
          BROWSER_ENGINE: firefox
      - name: Verify WebKit viewer assets and WASM protocol bindings
        if: runner.os == 'Linux'
        run: node ../../scripts/smoke-gateway-browser.cjs ../../artifacts/release/gateway/dist
        env:
          BROWSER_ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/gateway-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-browser-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/gateway/dist
          if-no-files-found: error
      # The production audio pipe type graph imports generated protocol bindings.
      # Run after the complete gateway build, not in the management-only job.
      - name: Require native Windows playback endpoint
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force artifacts/audio-playback | Out-Null
          cargo build --locked --manifest-path components/audio-target/Cargo.toml --bin audio-probe 2>&1 | Tee-Object -FilePath artifacts/audio-playback/native-probe-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/record-windows-audio-environment.cjs components/audio-target/target/debug/audio-probe.exe --require-output
      - name: Verify browser audio and microphone RTP lifecycle
        shell: bash
        working-directory: .
        env:
          BROWSER_CHANNEL: chromium
        run: |
          for engine in chromium firefox; do
            if [[ "$RUNNER_OS" == Linux ]]; then
              BROWSER_ENGINE="$engine" sh scripts/test-audio-target-linux.sh --command node scripts/test-audio-playback-browser.cjs
            else
              BROWSER_ENGINE="$engine" node scripts/test-audio-playback-browser.cjs
            fi
          done
      # The Windows Playwright WebKit build lacks Web Audio and media tracks.
      # Exercise the actual media APIs on Linux instead of counting that engine
      # as supported from management-page-only tests.
      - name: Verify WebKit audio and microphone RTP lifecycle
        if: runner.os == 'Linux'
        working-directory: .
        env:
          BROWSER_ENGINE: webkit
        run: sh scripts/test-audio-target-linux.sh --command node scripts/test-audio-playback-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audio-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/audio-playback/
          if-no-files-found: warn

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: source-sbom-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: stream-kit-sbom.spdx.json
          output-file: stream-kit-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: stream-kit-sbom
          path: stream-kit-sbom.spdx.json

