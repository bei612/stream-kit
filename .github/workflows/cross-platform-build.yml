name: cross-platform-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: orchestrator/go.sum
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o dist/orchestrator${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/orchestrator

  web:
    name: Management Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: orchestrator/web/package-lock.json
      - run: npm ci
      - run: npm run build

  moonlight-web:
    name: Moonlight Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: third_party/moonlight-web-stream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/moonlight-web-stream
      - run: cargo check --locked
      - run: cargo test --locked

