name: android-client

on:
  push:
    branches: [main]
    paths:
      - 'third_party/moonlight-android/**'
      - 'third_party-manifests/moonlight-android.json'
      - 'scripts/android/**'
      - 'scripts/test-android-protocol.mjs'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'third_party/moonlight-android/**'
      - 'third_party-manifests/moonlight-android.json'
      - 'scripts/android/**'
      - 'scripts/test-android-protocol.mjs'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-protocol:
    name: Android managed protocol (no APK acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: node scripts/test-android-protocol.mjs

  native-debug-build:
    name: Android debug build and managed HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned build SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build native client and test managed HTTP boundaries
        working-directory: third_party/moonlight-android
        run: ./gradlew :app:testNonRootDebugUnitTest :app:assembleNonRootDebug --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: third_party/moonlight-android/app/build/test-results/testNonRootDebugUnitTest/
          if-no-files-found: warn
