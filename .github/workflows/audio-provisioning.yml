name: audio-provisioning
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Native audio environment to verify without rebuilding the full platform'
        type: choice
        options: [linux, windows, windows-policy]
        default: linux
  push:
    branches: [main]
    paths:
      - 'orchestrator/internal/audiodevice/**'
      - 'orchestrator/cmd/orchestrator/prepare_audio.go'
      - 'scripts/test-audio-provisioning-pipewire.sh'
      - '.github/workflows/audio-provisioning.yml'
permissions:
  contents: read
jobs:
  linux-audio:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'linux'
    strategy:
      fail-fast: false
      matrix:
        backend: [pulse, pipewire]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum
      - if: matrix.backend == 'pulse'
        run: sudo apt-get update && sudo apt-get install -y pulseaudio pulseaudio-utils
      - if: matrix.backend == 'pipewire'
        run: sudo apt-get update && sudo apt-get install -y pipewire pipewire-pulse wireplumber pulseaudio-utils dbus
      - name: Provision and reuse real isolated recording endpoints
        if: matrix.backend == 'pulse'
        run: bash scripts/test-audio-target-linux.sh --command bash -c 'cd orchestrator && STREAM_KIT_ISOLATED_AUDIO_TEST=1 go test -v ./internal/audiodevice'
      - name: Provision and release PipeWire endpoints
        if: matrix.backend == 'pipewire'
        run: dbus-run-session -- bash scripts/test-audio-provisioning-pipewire.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audio-provisioning-${{ matrix.backend }}-logs
          path: artifacts/audio-provisioning/
          if-no-files-found: ignore

  windows-audio:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'windows' || inputs.target == 'windows-policy')
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Record Windows recording access without changing it
        run: node scripts/record-windows-audio-environment.cjs --policy-only
      - uses: actions/upload-artifact@v4
        with:
          name: windows-recording-access
          path: artifacts/audio-playback/windows-environment.json
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            components/audio-target
            third_party/moonlight-web-stream
          cache-on-failure: 'true'
      - name: Provision only the signed synthetic audio fixture
        run: |
          ./scripts/prepare-windows-audio-fixture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C orchestrator build -o ../artifacts/audio-playback/orchestrator-audio-driver.exe ./cmd/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/audio-playback/orchestrator-audio-driver.exe audio-driver install deploy/windows/usb-audio-driver 2>&1 | Tee-Object -FilePath artifacts/audio-playback/driver-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          cargo build --locked --manifest-path components/audio-target/Cargo.toml --bin audio-probe --example virtual_device --example verify_pair 2>&1 | Tee-Object -FilePath artifacts/audio-playback/native-probe-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native PCM and owned device cleanup
        if: inputs.target == 'windows'
        run: node scripts/test-windows-virtual-audio.cjs components/audio-target/target/debug --pair-only
      - name: Verify documented render endpoint policy in the disposable fixture
        if: inputs.target == 'windows-policy'
        run: |
          cargo build --locked --manifest-path third_party/moonlight-web-stream/Cargo.toml --bin web-server 2>&1 | Tee-Object -FilePath artifacts/audio-playback/native-gateway-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C orchestrator build -o ../artifacts/audio-playback/endpoint-policy-check.exe ./tests/endpoint-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-endpoint-policy.cjs components/audio-target/target/debug artifacts/audio-playback/endpoint-policy-check.exe third_party/moonlight-web-stream/target/debug/web-server.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-audio-environment
          path: artifacts/audio-playback/
          if-no-files-found: error
