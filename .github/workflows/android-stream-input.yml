name: android-stream-input-acceptance
on:
  workflow_dispatch:
    inputs:
      product_run_id:
        description: 'Owned product run with a completed successful Linux installer job'
        type: string
        required: true
      android_release_tag:
        description: 'Published signed Android release tag to test without rebuilding'
        type: string
        required: false
      android_run_id:
        description: 'Successful signed APK candidate run; select this OR android_release_tag'
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  native-android-web-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_RUN_ID: ${{ inputs.product_run_id }}
      ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag }}
      ANDROID_RUN_ID: ${{ inputs.android_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download and verify explicitly selected runtime and signed APK
        run: bash scripts/download-input-acceptance.sh
      - name: Prepare isolated capture, TLS and official Android dependencies
        run: |
          set -euo pipefail
          # Dependency names come only from the verified published package.
          mapfile -t dependencies < <(dpkg-deb -f artifacts/input-download/runtime.deb Depends | tr ',' '\n' | sed -E 's/^[[:space:]]*([a-z0-9+.-]+).*/\1/')
          for dependency in "${dependencies[@]}"; do [[ "$dependency" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${dependencies[@]}" libx11-dev x11-utils xvfb xauth xdotool openbox pulseaudio libnss3-tools
          artifacts/input-runtime/opt/stream-kit/orchestrator/orchestrator verify-platform artifacts/input-runtime/opt/stream-kit
          npm ci --prefix third_party/moonlight-web-stream --ignore-scripts --no-audit --no-fund
          android --sdk="$ANDROID_HOME" sdk install 'emulator' 'system-images;android-36;google_apis;x86_64' 'platforms;android-36' 'build-tools;36.0.0'
          node scripts/verify-input-acceptance-sources.mjs apk
          mkdir -p artifacts/input-example
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/input-acceptance/x11-observer.c -lX11 -o artifacts/input-example/x11-observer
          bash tools/input-acceptance/android/build.sh
      - name: Verify Android and Web input in the same real renderer
        timeout-minutes: 12
        run: bash scripts/ci-android-stream-input.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-stream-input-evidence
          path: |
            artifacts/android-input-evidence/
            artifacts/input-download/product-run.json
            artifacts/input-download/product-jobs.json
            artifacts/input-download/android-run.json
            artifacts/input-download/android-release.json
            artifacts/input-download/android-source.json
            artifacts/input-download/provenance.json
            artifacts/input-download/sbom.cdx.json
            artifacts/input-download/installer-manifest.json
            artifacts/source-stream/**/result.json
            artifacts/source-stream/**/example.log
          if-no-files-found: warn
          retention-days: 14
