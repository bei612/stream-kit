name: windows-installer-acceptance
on:
  workflow_run:
    workflows: [windows-product-release]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published immutable release to install; no builds are performed'
        type: string
        required: false
      product_run_id:
        description: 'Product run with a successful Windows installer build job; exclusive with release_tag'
        type: string
        required: false
      maintenance_candidate_run_id:
        description: 'Optional second product run providing the candidate for Windows runtime maintenance'
        type: string
        required: false
      verify_maintenance_apply:
        description: 'After rollback, verify the same candidate installs successfully with the conflict removed'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  select-source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.select.outputs.install }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_RUN_ID: ${{ github.event.workflow_run.id || inputs.product_run_id }}
      PRODUCT_COMMIT: ${{ github.event.workflow_run.head_sha }}
      VERIFY_MAINTENANCE_APPLY: ${{ inputs.verify_maintenance_apply }}
      MAINTENANCE_CANDIDATE_RUN_ID: ${{ inputs.maintenance_candidate_run_id }}
    steps:
      - name: Select an installer build, excluding publication-only runs
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && -n "$PRODUCT_RUN_ID" ]] || [[ -z "$RELEASE_TAG" && -z "$PRODUCT_RUN_ID" ]]; then
            echo 'Select exactly one release tag or product run' >&2; exit 1
          fi
          if [[ -n "$PRODUCT_RUN_ID" && ! "$PRODUCT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid product run ID' >&2; exit 1
          fi
          if [[ "$VERIFY_MAINTENANCE_APPLY" == true && -z "$MAINTENANCE_CANDIDATE_RUN_ID" ]]; then
            echo 'A successful maintenance check requires a distinct candidate run' >&2; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCT_RUN_ID/artifacts" > source-artifacts.json
            if ! jq -e --arg name "windows-product-installer-$PRODUCT_COMMIT" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length == 1' source-artifacts.json > /dev/null; then
              echo 'install=false' >> "$GITHUB_OUTPUT"
              echo 'No installer artifact in this run; installation acceptance is skipped. Publication-only runs do not create installers.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'install=true' >> "$GITHUB_OUTPUT"
  installed-service:
    needs: select-source
    if: needs.select-source.outputs.install == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_RUN_ID: ${{ github.event.workflow_run.id || inputs.product_run_id }}
      MAINTENANCE_CANDIDATE_RUN_ID: ${{ inputs.maintenance_candidate_run_id }}
      VERIFY_MAINTENANCE_APPLY: ${{ inputs.verify_maintenance_apply }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Prepare isolated recording access and audio services
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/prepare-windows-audio-fixture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          $session = (Get-Process -Id $PID).SessionId
          if ($session -eq 0) { throw 'Actual installer acceptance requires the hosted interactive render session' }
          Write-Output "Installer process session: $session"
      - name: Download existing signed-driver runtime installer
        if: inputs.release_tag != ''
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-preview\.[0-9]+(?:\.[0-9]+)*|-rc\.[1-9][0-9]*)?$') { throw 'Expected a stable, candidate or preview product tag' }
          git fetch --no-tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EXPECTED_INSTALLER_COMMIT = git rev-parse 'FETCH_HEAD^{commit}'
          gh release download $env:RELEASE_TAG --pattern '*windows-amd64-setup.exe' --pattern installer-manifest.json --dir artifacts/installer-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'),a=require('assert/strict'),m=JSON.parse(fs.readFileSync('artifacts/installer-download/installer-manifest.json'));a.equal(m.commit,process.env.EXPECTED_INSTALLER_COMMIT);a.equal(m.installer_source_commit,m.commit);a.equal(m.payload_profile,'runtime');a.equal(m.reused_payload,false)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download unpublished verified product artifact
        if: env.PRODUCT_RUN_ID != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCT_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read product run' }
          if ($run.path -ne '.github/workflows/windows-product-release.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.head_sha -notmatch '^[a-f0-9]{40}$') { throw 'Expected an owned product workflow' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCT_RUN_ID/jobs?filter=latest&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read product jobs' }
          $win = @($jobs.jobs | Where-Object { $_.name -eq 'Source-built Windows unified installer' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($win.Count -ne 1) { throw 'Expected one successful Windows installer build job' }
          $env:EXPECTED_INSTALLER_COMMIT = $run.head_sha
          gh run download $env:PRODUCT_RUN_ID --name "windows-product-installer-$($run.head_sha)" --dir artifacts/installer-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'),a=require('assert/strict'),m=JSON.parse(fs.readFileSync('artifacts/installer-download/installer-manifest.json'));a.equal(m.commit,process.env.EXPECTED_INSTALLER_COMMIT);a.equal(m.installer_source_commit,m.commit);a.equal(m.payload_profile,'runtime');a.equal(m.reused_payload,false)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@v5
        if: env.MAINTENANCE_CANDIDATE_RUN_ID != ''
        with:
          go-version-file: .go-version
      - name: Stage separately built runtime and native Example for rollback acceptance
        if: env.MAINTENANCE_CANDIDATE_RUN_ID != ''
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MAINTENANCE_CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Invalid maintenance candidate run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:MAINTENANCE_CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the maintenance candidate run' }
          if ($run.path -ne '.github/workflows/windows-product-release.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.head_sha -notmatch '^[a-f0-9]{40}$') { throw 'Expected an owned maintenance candidate build' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:MAINTENANCE_CANDIDATE_RUN_ID/jobs?filter=latest&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate jobs' }
          $built = @($jobs.jobs | Where-Object { $_.name -eq 'Source-built Windows unified installer' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($built.Count -ne 1) { throw 'Expected a successful Windows candidate job' }
          $baseline = Get-Content -Raw -LiteralPath 'artifacts/installer-download/installer-manifest.json' | ConvertFrom-Json
          if ($baseline.commit -eq $run.head_sha) { throw 'Rollback acceptance requires two distinct sources' }
          gh run download $env:MAINTENANCE_CANDIDATE_RUN_ID --name "windows-product-payload-$($run.head_sha)" --dir artifacts/maintenance-platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path 'artifacts/maintenance-example' | Out-Null
          go -C example build -trimpath -ldflags '-H=windowsgui' -o ../artifacts/maintenance-example/checkerboard.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source -Parent) -Parent
          $openssl = Join-Path $gitRoot 'usr/bin/openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) { throw 'Expected Git for Windows OpenSSL' }
          "STREAM_KIT_ROLLBACK_OPENSSL=$openssl" >> $env:GITHUB_ENV
          "STREAM_KIT_ROLLBACK_CANDIDATE=$($run.head_sha)" >> $env:GITHUB_ENV
      - name: Install, verify native PCM and service lifecycle, then uninstall
        run: node scripts/accept-windows-installer.cjs artifacts/installer-download/installer-manifest.json artifacts/installer-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-service-acceptance
          path: |
            artifacts/installer-acceptance/
            artifacts/audio-playback/windows-*.json
          if-no-files-found: warn
