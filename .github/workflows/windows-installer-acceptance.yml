name: windows-installer-acceptance
on:
  workflow_run:
    workflows: [windows-product-release]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published immutable release to install; no builds are performed'
        type: string
        required: false
      product_run_id:
        description: 'Successful windows-product-release run to accept before publication; exclusive with release_tag'
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  select-source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.select.outputs.install }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_RUN_ID: ${{ github.event.workflow_run.id || inputs.product_run_id }}
      PRODUCT_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Select an installer build, excluding publication-only runs
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && -n "$PRODUCT_RUN_ID" ]] || [[ -z "$RELEASE_TAG" && -z "$PRODUCT_RUN_ID" ]]; then
            echo 'Select exactly one release tag or product run' >&2; exit 1
          fi
          if [[ -n "$PRODUCT_RUN_ID" && ! "$PRODUCT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid product run ID' >&2; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCT_RUN_ID/artifacts" > source-artifacts.json
            if ! jq -e --arg name "windows-product-installer-$PRODUCT_COMMIT" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length == 1' source-artifacts.json > /dev/null; then
              echo 'install=false' >> "$GITHUB_OUTPUT"
              echo 'No installer artifact in this run; installation acceptance is skipped. Publication-only runs do not create installers.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'install=true' >> "$GITHUB_OUTPUT"
  installed-service:
    needs: select-source
    if: needs.select-source.outputs.install == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_RUN_ID: ${{ github.event.workflow_run.id || inputs.product_run_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Prepare isolated recording access and audio services
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/prepare-windows-audio-fixture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          $session = (Get-Process -Id $PID).SessionId
          if ($session -eq 0) { throw 'Actual installer acceptance requires the hosted interactive render session' }
          Write-Output "Installer process session: $session"
      - name: Download existing signed-driver runtime installer
        if: inputs.release_tag != ''
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[1-9][0-9]*)?$') { throw 'Expected a stable or candidate tag' }
          git fetch --no-tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EXPECTED_INSTALLER_COMMIT = git rev-parse 'FETCH_HEAD^{commit}'
          gh release download $env:RELEASE_TAG --pattern '*windows-amd64-setup.exe' --pattern installer-manifest.json --dir artifacts/installer-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'),a=require('assert/strict'),m=JSON.parse(fs.readFileSync('artifacts/installer-download/installer-manifest.json'));a.equal(m.commit,process.env.EXPECTED_INSTALLER_COMMIT);a.equal(m.installer_source_commit,m.commit);a.equal(m.payload_profile,'runtime');a.equal(m.reused_payload,false)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download unpublished verified product artifact
        if: env.PRODUCT_RUN_ID != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCT_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read product run' }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows-product-release.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Expected a successful owned product workflow' }
          $env:EXPECTED_INSTALLER_COMMIT = $run.head_sha
          gh run download $env:PRODUCT_RUN_ID --name "windows-product-installer-$($run.head_sha)" --dir artifacts/installer-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'),a=require('assert/strict'),m=JSON.parse(fs.readFileSync('artifacts/installer-download/installer-manifest.json'));a.equal(m.commit,process.env.EXPECTED_INSTALLER_COMMIT);a.equal(m.installer_source_commit,m.commit);a.equal(m.payload_profile,'runtime');a.equal(m.reused_payload,false)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, verify native PCM and service lifecycle, then uninstall
        run: node scripts/accept-windows-installer.cjs artifacts/installer-download/installer-manifest.json artifacts/installer-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-service-acceptance
          path: |
            artifacts/installer-acceptance/
            artifacts/audio-playback/windows-*.json
          if-no-files-found: warn
