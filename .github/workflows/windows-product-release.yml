name: windows-product-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Product version MAJOR.MINOR.PATCH for a stable candidate; blank builds a preview'
        type: string
        required: false
      usb_audio_identity:
        description: 'Optional USB audio identity override; blank uses the committed shared Audio class profile'
        type: string
        required: false
      promote_run_id:
        description: 'Completed successful product run to publish without rebuilding (blank builds only)'
        type: string
        required: false
      installer_acceptance_run_id:
        description: 'Successful windows-installer-acceptance run for the exact installer; required for promotion'
        type: string
        required: false
      release_tag:
        description: 'Matching stable, candidate or preview tag: vMAJOR.MINOR.PATCH[-rc.N] or v0.1.0-preview.DATE.N'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux product
    if: inputs.promote_run_id == ''
    uses: ./.github/workflows/linux-sunshine-build.yml
    with:
      release_version: ${{ inputs.release_version }}

  build:
    name: Source-built Windows unified installer
    if: inputs.promote_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      STREAM_KIT_RELEASE_VERSION: ${{ inputs.release_version }}
      STREAM_KIT_USB_AUDIO_IDENTITY: ${{ inputs.usb_audio_identity }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GOTOOLCHAIN: local
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/targets/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: |
            orchestrator/web/package-lock.json
            third_party/moonlight-web-stream/package-lock.json
      - name: Validate requested product version before native builds
        run: >-
          node --input-type=module -e "import {productRelease} from './scripts/lib/product-release.mjs'; console.log(JSON.stringify(productRelease(process.env.GITHUB_SHA,process.env.STREAM_KIT_RELEASE_VERSION || '')))"
      - name: Validate product audio identity before native builds
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import {validateUSBAudioIdentity} from './scripts/lib/windows-usb-audio-driver.mjs'; const raw=process.env.STREAM_KIT_USB_AUDIO_IDENTITY || fs.readFileSync('deploy/windows/usb-audio-identity.json','utf8'); if(raw.length>4096)throw Error('USB identity too large'); const value=validateUSBAudioIdentity(JSON.parse(raw)); fs.mkdirSync('artifacts/windows-product',{recursive:true}); fs.writeFileSync('artifacts/windows-product/usb-audio-identity.json',JSON.stringify(value));"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            orchestrator/go.sum
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify native Windows signature tooling
        run: node --test scripts/test-windows-powershell.mjs scripts/test-windows-usb-audio-driver.mjs scripts/test-installer-payload.mjs scripts/test-product-release.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          # Every native workspace, the official generator and the WASM shim
          # use the same Cargo-owned output root, as in local release builds.
          workspaces: third_party/moonlight-web-stream -> ../../.local/targets/native
          key: ${{ hashFiles('components/audio-target/Cargo.lock', 'third_party/moonlight-common-rust/Cargo.lock', 'third_party-manifests/gateway-web/*.Cargo.lock') }}
          cache-on-failure: 'true'
      - name: Prepare official release tools
        run: ./scripts/prepare-windows-release-tools.ps1
      - name: Verify actual silent setup failure and restart exit codes
        run: |
          node scripts/accept-installer-exit-codes.cjs "$env:INNO_ISCC" artifacts/installer-outcome-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Silent setup outcome regression' }
      - name: Install locked frontend and binding build dependencies
        run: |
          Push-Location orchestrator/web
          try { npm ci; if ($LASTEXITCODE -ne 0) { throw 'Management dependency installation failed' } }
          finally { Pop-Location }
          Push-Location third_party/moonlight-web-stream
          try { npm ci; if ($LASTEXITCODE -ne 0) { throw 'Gateway dependency installation failed' } }
          finally { Pop-Location }
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked wasm-bindgen installation failed' }
      - name: Build runtime control, native gateway and Web
        env:
          CMAKE_GENERATOR: NMake Makefiles
        run: |
          node scripts/build-control-plane.mjs --require-clean --output artifacts/windows-product/control
          if ($LASTEXITCODE -ne 0) { throw 'Control bundle failed' }
          node scripts/build-gateway-release.mjs --output artifacts/windows-product/gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway bundle failed' }
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make patch diffutils autoconf automake libtool texinfo
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-MinHook
      - name: Verify native dependencies before codec compilation
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pkg-config --static --exists libtiff-4 harfbuzz freetype2 libcurl miniupnpc opus
          mkdir -p artifacts/windows-product/logs
          pacman -Q > artifacts/windows-product/logs/ucrt-packages.txt
      - uses: actions/cache/restore@v4
        id: codec-cache
        with:
          path: .local/cmake-build-sunshine-deps
          key: windows-codec-sdk-v1-${{ hashFiles('artifacts/windows-product/logs/ucrt-packages.txt', 'third_party/sunshine/third-party/build-deps/**', 'tools/sunshine-codec-probe/**', 'third_party-manifests/sunshine-dependencies.json', 'third_party-manifests/windows-release-tools.json') }}
      - name: Build integrated Sunshine and vendored codecs
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: minimal
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          BUILD_JOBS: '2'
          SUNSHINE_REQUIRE_CLEAN: '1'
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$KITWARE_BIN"):$(cygpath -u "$RELEASE_NODE_BIN"):$PATH"
          export CC="$(cygpath -m "$MSYS2_ROOT")/ucrt64/bin/gcc.exe"
          export CXX="$(cygpath -m "$MSYS2_ROOT")/ucrt64/bin/g++.exe"
          mkdir -p artifacts/windows-product/logs
          pacman -Q > artifacts/windows-product/logs/msys2-packages.txt
          cmake --version > artifacts/windows-product/logs/cmake-version.txt
          # Product packaging does not execute the Windows GTest binary. Build
          # only the production target; native checks have their own CI/fixtures.
          bash scripts/build-sunshine.sh -DBUILD_DOCS=OFF -DBUILD_TESTS=OFF -DSUNSHINE_USE_STATIC_QT=ON 2>&1 | tee artifacts/windows-product/logs/sunshine-build.log
          node scripts/verify-sunshine-release.mjs "$(cygpath -m "$PWD/.local/cmake-build-sunshine")" "$GITHUB_SHA" --output "$(cygpath -m "$PWD/artifacts/windows-product/renderer")"
      - uses: actions/cache/save@v4
        if: always() && steps.codec-cache.outputs.cache-primary-key != '' && steps.codec-cache.outputs.cache-hit != 'true'
        with:
          path: .local/cmake-build-sunshine-deps
          key: ${{ steps.codec-cache.outputs.cache-primary-key }}
      - name: Assemble verified runtime payload
        run: |
          node scripts/package-platform-release.mjs artifacts/windows-product/control artifacts/windows-product/gateway artifacts/windows-product/renderer artifacts/windows-product/platform
          if ($LASTEXITCODE -ne 0) { throw 'Platform inventory verification failed' }
      # Preserve the verified inputs independently of installer compilation.
      # Installer-only fixes can use --reuse-payload without rebuilding codecs
      # or extracting files from an installed customer deployment.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-product-payload-${{ github.sha }}
          path: artifacts/windows-product/platform/
          if-no-files-found: error
          retention-days: 7
      - name: Compile unified installer
        run: |
          if (-not $env:WindowsSdkVerBinPath) { throw 'Official Windows SDK tool directory is unavailable' }
          $signatureTool = Join-Path $env:WindowsSdkVerBinPath 'x64/signtool.exe'
          if (-not (Test-Path -LiteralPath $signatureTool -PathType Leaf)) { throw 'Official Windows SDK signtool.exe is unavailable' }
          $audioArguments = @('--usb-audio-driver', 'deploy/windows/usb-audio-driver', '--signtool', $signatureTool, '--usb-audio-identity', 'artifacts/windows-product/usb-audio-identity.json')
          node scripts/build-windows-installer.mjs artifacts/windows-product/platform artifacts/windows-product/installer "$env:INNO_ISCC" @audioArguments
          if ($LASTEXITCODE -ne 0) { throw 'Unified installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-product-installer-${{ github.sha }}
          path: artifacts/windows-product/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-product-build-logs-${{ github.sha }}
          path: |
            artifacts/windows-product/logs/
            artifacts/windows-product/*/bundle-manifest.json
          if-no-files-found: warn

  sbom:
    name: Source SBOM
    if: inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: windows-product-source-sbom
          output-file: stream-kit-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-product-sbom-${{ github.sha }}
          path: stream-kit-sbom.spdx.json
          if-no-files-found: error

  promote:
    name: Promote verified product artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.promote_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact promotion rules
        run: node --test scripts/test-product-release.mjs
      - name: Verify successful source run and publish immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.promote_run_id }}
          INSTALLER_ACCEPTANCE_RUN_ID: ${{ inputs.installer_acceptance_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/promote-product-release.sh
